<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>5D Function Visualizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside id="ui" aria-label="Visualizer controls">
    <div id="uiContent">
      <header class="panelHeader">
        <div>
          <h1>5D Graph</h1>
          <p>Volume raymarching</p>
        </div>
        <span id="status" class="status status-ok">Ready</span>
      </header>

      <section class="controlSection">
        <label for="fn">Function <code>f(x, y, z, t)</code></label>
        <textarea id="fn" spellcheck="false">float radius = 0.4 + 0.05 * sin(t * 0.7);
float twistSpeed = 1.0;
float helixHeight = 1.0;

float angle = twistSpeed * t + z * 3.0;
float hx1 = cos(angle) * radius;
float hy1 = sin(angle) * radius;
float hx2 = cos(angle + 3.1416) * radius;
float hy2 = sin(angle + 3.1416) * radius;

float d1 = length(vec2(x - hx1, y - hy1 * helixHeight));
float d2 = length(vec2(x - hx2, y - hy2 * helixHeight));
float density1 = exp(-20.0 * d1 * d1);
float density2 = exp(-20.0 * d2 * d2);
float pulse = 0.5 + 0.5 * sin(t * 3.0);

return clamp((density1 + density2) * pulse, 0.0, 1.0);</textarea>
        <div class="hint">GLSL body. Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to compile.</div>
      </section>

      <section class="controlSection">
        <div class="sectionTitle">Volume</div>
        <div class="switchRow">
          <span>Cube</span>
          <label class="switch" title="Switch between cube and sphere clipping">
            <input id="shapeSphere" type="checkbox" />
            <span class="switchTrack"></span>
          </label>
          <span>Sphere</span>
        </div>
        <label class="checkRow">
          <input id="showBounds" type="checkbox" checked />
          <span>Show bounds</span>
        </label>
      </section>

      <section class="controlSection">
        <div class="sectionTitle">Domain</div>
        <div class="hint">Spatial coordinates are mapped from the clipping volume to these ranges.</div>
        <div class="axisGrid">
          <span>x</span><input id="xmin" type="number" step="any" value="-1" /><input id="xmax" type="number" step="any" value="1" />
          <span>y</span><input id="ymin" type="number" step="any" value="-1" /><input id="ymax" type="number" step="any" value="1" />
          <span>z</span><input id="zmin" type="number" step="any" value="-1" /><input id="zmax" type="number" step="any" value="1" />
        </div>
      </section>

      <section class="controlSection">
        <div class="sectionTitle">Rendering</div>
        <div class="twoCols">
          <label>Alpha scale<input id="valscale" type="number" step="any" min="0.000001" value="1.0" /></label>
          <label>Opacity boost<input id="opacityBoost" type="number" step="0.1" min="0" value="1.0" /></label>
          <label>Ray steps<input id="steps" type="number" step="1" min="8" max="2048" value="128" /></label>
          <label>Jitter<input id="jitter" type="number" step="0.05" min="0" max="1" value="0.5" /></label>
          <label>Min alpha<input id="minAlpha" type="number" step="0.0001" min="0" max="1" value="0.001" /></label>
          <label>Pixel ratio cap<input id="pixelRatioCap" type="number" step="0.25" min="0.5" max="4" value="2" /></label>
        </div>
      </section>

      <section class="controlSection">
        <div class="sectionTitle">Time</div>
        <div class="buttonGrid">
          <label>Speed<input id="speed" type="number" step="0.1" value="1.0" /></label>
          <button id="pause" type="button">Pause</button>
          <button id="reset" type="button">Reset t</button>
        </div>
      </section>

      <section class="controlSection">
        <div class="sectionTitle">Light</div>
        <label class="checkRow">
          <input id="lightEnabled" type="checkbox" checked />
          <span>Enabled</span>
        </label>
        <label>Position</label>
        <div class="threeCols">
          <input id="lightX" type="number" step="0.1" value="2.5" aria-label="Light X" />
          <input id="lightY" type="number" step="0.1" value="0.5" aria-label="Light Y" />
          <input id="lightZ" type="number" step="0.1" value="0.0" aria-label="Light Z" />
        </div>
        <div class="twoCols">
          <label>Intensity<input id="lightIntensity" type="number" step="0.1" min="0" value="5.0" /></label>
          <label>Shadow steps<input id="lightSteps" type="number" step="1" min="1" max="128" value="24" /></label>
          <label>Attenuation<input id="lightAttenuation" type="number" step="0.1" min="0" value="1.0" /></label>
          <label>Ambient<input id="ambient" type="number" step="0.01" min="0" value="0.18" /></label>
        </div>
      </section>

      <button id="compile" class="primaryButton" type="button">Apply / Compile</button>
      <pre id="errorBox" class="errorBox" hidden></pre>
    </div>
    <div id="resizer" title="Drag to resize"></div>
  </aside>

  <canvas id="gl"></canvas>

  <script defer src="js/shaders.js"></script>
  <script defer src="js/geometry.js"></script>
  <script defer src="js/camera.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/renderer.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
